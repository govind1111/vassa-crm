<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vassa Properties CRM</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f2;--pri:#4f46e5;--pri2:#eef2ff;--red:#dc2626;--redbg:#fef2f2;--grn:#16a34a;--amb:#d97706;--r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri);text-decoration:none}
h2{font-size:20px;margin:0}h3{font-size:15px;margin:0 0 10px}
.mut{color:var(--mut);font-size:12px}.red{color:var(--red)!important}.b{font-weight:700}
/* layout */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{height:30px;width:auto;display:block;flex:none}
.top .t{flex:1;min-width:0}.top .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--pri2);color:var(--pri);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;font-weight:600}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--pri);z-index:60;transition:width .3s}
#bar.on{width:70%;transition:width 8s cubic-bezier(.1,.8,.2,1)}
main{padding:14px 14px 96px;max-width:1200px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.bnav button,.side button{border:0;background:none;cursor:pointer;color:var(--mut)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 0;border-radius:10px}
.bnav button.on,.side button.on{color:var(--pri)}.bnav button.on svg{background:var(--pri2);border-radius:10px}
.bnav svg{width:38px;height:26px;padding:3px 9px}
.side{display:none}
svg.i{fill:currentColor}
@media(min-width:900px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;width:220px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;z-index:21}
  .side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:700}
  .side .brand img{width:150px;height:auto;display:block}
  .side button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left}
  .side button svg{width:20px;height:20px}
  .side button.on{background:var(--pri2);font-weight:600}
  .side .caret{margin-left:auto;font-style:normal;font-size:10px;color:var(--mut);transition:transform .18s}
  .side .exp .caret{transform:rotate(180deg)}
  .side .sub{display:none;flex-direction:column;gap:2px;margin:0 0 4px 14px;border-left:2px solid var(--line);padding-left:6px}
  .side .sub.on{display:flex}
  .side .sub button{padding:7px 10px;font-size:13px;color:var(--mut);font-weight:500;background:none;border-radius:8px}
  .side .sub button:hover{background:#f8fafc;color:var(--ink)}
  .side .sub button.on{background:var(--pri2);color:var(--pri);font-weight:600}
  .side .ver{margin-top:auto;font-size:10.5px;line-height:1.35;color:var(--mut);padding:10px 12px 2px;border-top:1px solid var(--line)}
  .top,main{margin-left:220px}.top .logo{display:none}
  /* desktop par master ke options sirf sidebar me - right panel me repeat nahi */
  #masterSeg{display:none}
  main{padding:20px 24px 40px}
}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;cursor:pointer;border:0;text-align:left;position:relative;overflow:hidden}
.kpi .n{font-size:24px;font-weight:800;letter-spacing:-.5px}.kpi .l{font-size:12px;color:var(--mut)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#cbd5e1)}
.kpi.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}.kpi.hero .l{color:#e0e7ff}.kpi.hero:before{display:none}
.grid2{display:grid;gap:12px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.mini{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:10px;text-align:center;cursor:pointer;border:0}
.mini .n{font-size:20px;font-weight:800}.mini .l{font-size:11px;color:var(--mut)}
.alert{background:var(--redbg);border:1px solid #fecaca}.alert h3{color:var(--red)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#f1f5f9;color:#334155}
.chip.dot:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-New{background:#dbeafe;color:#1d4ed8}.s-Assigned{background:#fef3c7;color:#b45309}.s-Contacted{background:#ede9fe;color:#6d28d9}
.s-SiteVisit{background:#cffafe;color:#0e7490}.s-Negotiation{background:#ffedd5;color:#c2410c}.s-Closed{background:#dcfce7;color:#15803d}.s-Lost{background:#e5e7eb;color:#4b5563}
.c-New{--c:#2563eb}.c-Assigned{--c:#d97706}.c-Contacted{--c:#7c3aed}.c-SiteVisit{--c:#0891b2}.c-Negotiation{--c:#ea580c}.c-Closed{--c:#16a34a}.c-Lost{--c:#6b7280}
.chip.od{background:#fee2e2;color:#b91c1c}.chip.td{background:#fef3c7;color:#92400e}.chip.ok{background:#f1f5f9;color:#334155}
/* list rows */
.li{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}.li .m{flex:1;min-width:0}.li .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--pri2);color:var(--pri)}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right}
.perf th,.perf td,.perf th.n,.perf td.n{text-align:center}
.tw{overflow-x:auto}
/* forms */
label.f{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d6dce8;border-radius:10px;background:#fff;font-size:15px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px #e0e7ff}
textarea{resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn.w{width:100%}.btn.sec{background:var(--pri2);color:var(--pri)}.btn.gry{background:#f1f5f9;color:#334155}.btn.grn{background:#16a34a}.btn.wa{background:#25d366;color:#fff}.btn.dng{background:#fee2e2;color:#b91c1c}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5}
/* Buttons: burgundy background + yellow text (Govind, 2026-11-05) */
.btn,.btn.sec,.btn.gry,.btn.grn,.btn.wa,.btn.dng,.iconbtn{background:#6D1A36!important;color:#FFD23F!important}
.btn:hover,.btn:active,.iconbtn:hover,.iconbtn:active{background:#571229!important}
.btn:focus-visible,.iconbtn:focus-visible{outline:2px solid #FFD23F;outline-offset:2px}
.seg{display:flex;background:#e9edf5;border-radius:12px;padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 12px}
.filters select{padding:8px 10px;font-size:13px}
.search{position:relative}.search input{padding-left:36px}.search:before{content:"⌕";position:absolute;left:12px;top:8px;font-size:18px;color:var(--mut)}
/* lead cards */
.lc{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px;margin-bottom:10px;cursor:pointer}
.lc .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lc .h b{font-size:14.5px}.lc .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
/* pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;margin:0 -14px;padding-left:14px;padding-right:14px}
.col{flex:0 0 82%;max-width:300px;background:#eceff6;border-radius:var(--r);padding:10px;scroll-snap-align:start}
@media(min-width:600px){.col{flex:0 0 270px}}
.col .ch{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-weight:700}
.col .ch .cnt{background:#fff;border-radius:999px;padding:1px 9px;font-size:12px}
.col .bar{height:4px;border-radius:4px;background:var(--c);margin:-2px 2px 10px}
.col .lc{padding:10px}.col .mv{margin-top:8px;padding:6px 8px;font-size:12.5px;border-radius:8px;background:#f8fafc}
/* drawer & dialog */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:none}
.scrim.on{display:block;animation:fade .15s}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:20px 20px 0 0;z-index:41;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:0 16px 24px}
.drawer.on{transform:none}
.drawer .grab{width:40px;height:4px;background:#cbd5e1;border-radius:4px;margin:8px auto 4px}
.dh{position:sticky;top:0;background:#fff;padding:8px 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
@media(min-width:900px){.drawer{left:auto;top:0;width:480px;max-height:none;border-radius:0;transform:translateX(105%)}.drawer .grab{display:none}}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(94vw,520px);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;z-index:51;padding:18px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg.on{display:block;transform:translate(-50%,-50%) scale(1);transition:transform .15s}
#scrim2{z-index:50}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:420px){.acts{grid-template-columns:repeat(4,1fr)}}
.acts .btn{flex-direction:column;font-size:12px;padding:8px 4px;gap:2px}.acts .btn span{font-size:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
.kv div span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.notes{background:#f8fafc;border-radius:10px;padding:10px;white-space:pre-wrap;font-size:13px;margin-bottom:12px;max-height:160px;overflow:auto}
.waban{background:#dcfce7;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tl{position:relative;padding-left:18px}.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .e{position:relative;padding:0 0 12px}.tl .e:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--pri)}
/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
@media(min-width:900px){#toasts{bottom:24px;left:auto;right:24px;transform:none;align-items:flex-end}}
.toast{background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fade .2s;pointer-events:auto}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}.toast.warn{background:#b45309}
.spin{width:28px;height:28px;border:3px solid #e0e7ff;border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* reports */
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 0 0;border-bottom:1px solid var(--line)}
.bars .d{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%;justify-content:center}
.bars .v{width:40%;max-width:22px;border-radius:6px 6px 0 0;background:#818cf8;position:relative;min-height:2px}
.bars .v.c{background:#22c55e}.bars .v i{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--mut)}
.blbl{display:flex;gap:8px}.blbl div{flex:1;text-align:center;font-size:11px;color:var(--mut);padding-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.hbar .lb{width:110px;flex:none}.hbar .tr{flex:1;background:#f1f5f9;border-radius:6px;height:20px;overflow:hidden}
.hbar .fl{height:100%;background:var(--c,#818cf8);border-radius:6px}.hbar .vl{width:44px;text-align:right;font-weight:700}
.repacts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.ctrl{display:flex;gap:8px;align-items:center;margin-bottom:12px}.ctrl input{max-width:200px}
.stats4{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.stats4 div{background:#f8fafc;border-radius:10px;padding:10px}.stats4 b{display:block;font-size:20px}
/* team */
.ex{display:flex;gap:12px;align-items:center}
.sw{position:relative;width:44px;height:26px;flex:none;border:0;border-radius:999px;background:#cbd5e1;cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#16a34a}.sw.on:after{left:21px}
.exg{display:grid;gap:12px}@media(min-width:700px){.exg{grid-template-columns:1fr 1fr}}
.pv{background:#e7fbe9;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:13.5px;border:1px solid #bbf7d0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{border:1px dashed #a5b4fc;background:var(--pri2);color:var(--pri);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chips button.on{background:var(--pri);border-style:solid;border-color:var(--pri);color:#fff;font-weight:600}
/* dropdown (multi-select) */
.dd{position:relative}
.ddbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid #d6dce8;border-radius:10px;background:#fff;font-size:15px;text-align:left;cursor:pointer;color:var(--ink)}
.dd.on .ddbtn{border-color:var(--pri);box-shadow:0 0 0 3px #e0e7ff}
.dd .caret{font-style:normal;font-size:10px;color:var(--mut);transition:transform .18s}
.dd.on .caret{transform:rotate(180deg)}
.ddmenu{display:none;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:4px;max-height:200px;overflow:auto;background:#fff}
.dd.on .ddmenu{display:block}
.ddmenu label{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.ddmenu label:hover{background:var(--pri2)}
.ddmenu input[type=checkbox]{width:auto;margin:0;padding:0;accent-color:var(--pri)}
@media print{
  .top,.bnav,.side,.noprint,#toasts,.drawer,.dlg,.scrim,#bar{display:none!important}
  .top,main{margin:0!important}main{padding:0!important;max-width:none}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .view{display:none!important}#v-reports{display:block!important}
}
</style>
</head>
<body>

<div class="scrim" id="scrim2" data-act="closeDlg"></div>
<div class="dlg" id="dlg"></div>
<div id="toasts"></div>
<script>
// Real Estate CRM - GUI v3 (Code.gs v4 ke saath). Vanilla JS, koi CDN nahi.
/*CALC-START*/
// ===== Pure compute functions (DOM nahi chhoote) - node harness inko alag se test karta hai =====
var Calc = (function () {
  var IST = 330 * 60000;
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var BUCKETS = ['Instagram', 'Facebook/Meta', 'Other'];
  var CONTACTED_PLUS = ['Contacted', 'Site Visit', 'Negotiation', 'Closed'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function istDay(ms) { var d = new Date(ms + IST); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function isYmd(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
  function ms(iso) {
    if (!iso) return NaN;
    var s = String(iso);
    if (isYmd(s)) return Date.parse(s + 'T00:00:00+05:30');
    return Date.parse(s);
  }
  function dayOf(iso) {
    var t = ms(iso);
    if (!isNaN(t)) return istDay(t);
    var m = String(iso || '').match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : '';
  }
  function addDays(ymd, n) {
    var d = new Date(Date.parse(ymd + 'T00:00:00Z') + n * 86400000);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function fmtDay(ymd) {
    if (!isYmd(ymd)) return ymd || '';
    var p = ymd.split('-');
    return p[2] + ' ' + MONTHS[Number(p[1]) - 1];
  }
  function fmtMonth(ym) { var p = String(ym).split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }
  function fmtDT(iso) {
    var t = ms(iso);
    if (isNaN(t)) return iso || '';
    var d = new Date(t + IST), h = d.getUTCHours(), ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return pad(d.getUTCDate()) + ' ' + MONTHS[d.getUTCMonth()] + ', ' + h + ':' + pad(d.getUTCMinutes()) + ' ' + ap;
  }
  function agoText(iso, nowMs) {
    var t = ms(iso);
    if (isNaN(t)) return '';
    var m = Math.max(0, Math.round((nowMs - t) / 60000));
    var n = m < 60 ? m : m < 1440 ? Math.floor(m / 60) : Math.floor(m / 1440);
    var u = m < 60 ? 'Minute' : m < 1440 ? 'Hour' : 'Day';
    if (n < 1) return 'Just Now';
    return 'Before ' + n + ' ' + u + (n === 1 ? '' : 's');
  }
  function isOpen(l) { return l.status !== 'Closed' && l.status !== 'Lost'; }
  function bucket(src) {
    src = String(src || '');
    if (/insta|(^|[^a-z])ig([^a-z]|$)/i.test(src)) return 'Instagram';
    if (/facebook|meta|fb/i.test(src)) return 'Facebook/Meta';
    return 'Other';
  }
  function pct(a, b) { return b ? Math.round(a * 1000 / b) / 10 : 0; }
  function followState(l, today) {
    if (!isOpen(l)) return '';
    if (!isYmd(l.followup)) return 'none';
    if (l.followup < today) return 'overdue';
    if (l.followup === today) return 'today';
    if (l.followup === addDays(today, 1)) return 'tomorrow';
    return 'later';
  }
  function topKey(obj) {
    var best = '', n = 0;
    Object.keys(obj).forEach(function (k) { if (obj[k] > n) { n = obj[k]; best = k; } });
    return best ? { key: best, count: n } : null;
  }
  function sortedPairs(obj) {
    return Object.keys(obj).map(function (k) { return { key: k, count: obj[k] }; })
      .sort(function (a, b) { return b.count - a.count; });
  }
  function leadMap(leads) { var m = {}; leads.forEach(function (l) { m[l.id] = l; }); return m; }
  function execNames(D) {
    var seen = {}, out = [];
    (D.executives || []).forEach(function (e) { if (!seen[e.name]) { seen[e.name] = 1; out.push(e.name); } });
    (D.leads || []).forEach(function (l) { if (l.exec && !seen[l.exec]) { seen[l.exec] = 1; out.push(l.exec); } });
    return out;
  }
  function counts(leads, statuses) {
    var c = {};
    statuses.forEach(function (s) { c[s] = 0; });
    leads.forEach(function (l) { if (c[l.status] === undefined) c[l.status] = 0; c[l.status]++; });
    return c;
  }
  // log rows chronological order mein (purane pehle)
  function chrono(log) {
    return (log || []).slice().sort(function (a, b) { return (ms(a.at) || 0) - (ms(b.at) || 0); });
  }

  // ---------- Dashboard ----------
  function dashboard(D, nowMs) {
    var today = istDay(nowMs), leads = D.leads || [], staleMin = D.staleMinutes || 30;
    var c = counts(leads, D.statuses || []);
    var stale = leads.filter(function (l) {
      var t = ms(l.assignedAt);
      return l.status === 'Assigned' && !isNaN(t) && nowMs - t > staleMin * 60000;
    }).sort(function (a, b) { return ms(a.assignedAt) - ms(b.assignedAt); });
    var todayF = leads.filter(function (l) { return followState(l, today) === 'today'; });
    var overdue = leads.filter(function (l) { return followState(l, today) === 'overdue'; })
      .sort(function (a, b) { return a.followup < b.followup ? -1 : 1; });
    var unassigned = leads.filter(function (l) { return !l.exec && isOpen(l); });
    var perf = execNames(D).map(function (n) {
      var mine = leads.filter(function (l) { return l.exec === n; });
      return {
        name: n, total: mine.length,
        open: mine.filter(isOpen).length,
        closed: mine.filter(function (l) { return l.status === 'Closed'; }).length,
        overdue: mine.filter(function (l) { return followState(l, today) === 'overdue'; }).length,
        stale: stale.filter(function (l) { return l.exec === n; }).length
      };
    });
    return {
      today: today, total: leads.length, counts: c, conv: pct(c.Closed || 0, leads.length),
      stale: stale, todayF: todayF, overdue: overdue, unassigned: unassigned,
      newUnassigned: leads.filter(function (l) { return l.status === 'New' && !l.exec; }).length,
      perf: perf, recent: chrono(D.log).slice(-10).reverse()
    };
  }

  // ---------- Agenda ----------
  function agenda(leads, today) {
    var a = { overdue: [], today: [], tomorrow: [], none: [] };
    leads.forEach(function (l) {
      var s = followState(l, today);
      if (a[s]) a[s].push(l);
    });
    a.overdue.sort(function (x, y) { return x.followup < y.followup ? -1 : 1; });
    return a;
  }

  // ---------- Leads list ----------
  function filterLeads(leads, f) {
    f = f || {};
    var q = String(f.q || '').toLowerCase().trim(), qd = q.replace(/\D/g, '');
    return leads.filter(function (l) {
      if (f.status && l.status !== f.status) return false;
      if (f.exec === '__none' && l.exec) return false;
      if (f.exec && f.exec !== '__none' && l.exec !== f.exec) return false;
      if (f.source) {
        if (f.source.indexOf('b:') === 0 && bucket(l.source) !== f.source.slice(2)) return false;
        if (f.source.indexOf('r:') === 0 && String(l.source) !== f.source.slice(2)) return false;
      }
      if (q) {
        var hay = (l.name + ' ' + l.id + ' ' + l.phone).toLowerCase();
        var ph = String(l.phone).replace(/\D/g, '');
        if (hay.indexOf(q) < 0 && !(qd.length >= 3 && ph.indexOf(qd) > -1)) return false;
      }
      return true;
    }).sort(function (a, b) {
      var ta = ms(a.date), tb = ms(b.date);
      if (isNaN(ta)) ta = -Infinity;
      if (isNaN(tb)) tb = -Infinity;
      if (tb !== ta) return tb - ta;
      return String(b.id).localeCompare(String(a.id));
    });
  }
  function csvCell(v) {
    var s = String(v === null || v === undefined ? '' : v);
    if (/^[=+\-@]/.test(s) && !/^[+\-]?\d[\d\s]*$/.test(s)) s = "'" + s; // spreadsheet formula injection se bachao
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(headers, rows) {
    return [headers].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  }
  function leadsCSV(list) {
    return toCSV(['Lead ID', 'Date', 'Name', 'Phone', 'Source / Campaign', 'Project / Property', 'Assigned Executive', 'Status', 'Lost Reason', 'Next Follow-up', 'Notes'],
      list.map(function (l) { return [l.id, fmtDT(l.date), l.name, l.phone, l.source, l.project, l.exec, l.status, l.lost, l.followup, l.notes]; }));
  }

  // ---------- Reports ----------
  function daily(D, ymd) {
    var leads = D.leads || [], map = leadMap(leads), log = chrono(D.log);
    var dayLog = log.filter(function (x) { return dayOf(x.at) === ymd; });
    var newLeads = leads.filter(function (l) { return dayOf(l.date) === ymd; });
    var bySource = { 'Instagram': 0, 'Facebook/Meta': 0, 'Other': 0 }, raw = {};
    newLeads.forEach(function (l) { bySource[bucket(l.source)]++; var k = l.source || '(blank)'; raw[k] = (raw[k] || 0) + 1; });
    var statusCh = {};
    (D.statuses || []).forEach(function (s) { statusCh[s] = 0; });
    var lostIds = {}, closedIds = {};
    dayLog.forEach(function (x) {
      if (x.type !== 'Status') return;
      statusCh[x.to] = (statusCh[x.to] || 0) + 1;
      if (x.to === 'Lost') lostIds[x.id] = 1;
      if (x.to === 'Closed') closedIds[x.id] = 1;
    });
    var reasons = {};
    Object.keys(lostIds).forEach(function (id) { var r = (map[id] && map[id].lost) || '(No reason)'; reasons[r] = (reasons[r] || 0) + 1; });
    dayLog.forEach(function (x) { if (x.type === 'Lost Reason' && x.to && !lostIds[x.id]) reasons[x.to] = (reasons[x.to] || 0) + 1; });
    var open = leads.filter(isOpen), fu = { pending: open.length, today: 0, tomorrow: 0, overdue: 0, none: 0 };
    open.forEach(function (l) { var s = followState(l, ymd); if (fu[s] !== undefined) fu[s]++; });
    var execs = execNames(D).map(function (n) {
      var mine = leads.filter(function (l) { return l.exec === n; });
      return {
        name: n,
        assigned: dayLog.filter(function (x) { return x.type === 'Assignment' && x.to === n; }).length,
        updates: dayLog.filter(function (x) { return x.type === 'Status' && map[x.id] && map[x.id].exec === n && x.by !== 'AUTO'; }).length,
        closed: Object.keys(closedIds).filter(function (id) { return map[id] && map[id].exec === n; }).length,
        open: mine.filter(isOpen).length,
        overdue: mine.filter(function (l) { return followState(l, ymd) === 'overdue'; }).length
      };
    });
    return {
      date: ymd, newCount: newLeads.length, bySource: bySource, topSource: topKey(bySource), topRawSource: topKey(raw),
      statusChanges: statusCh, topLost: topKey(reasons), lostReasons: sortedPairs(reasons), followups: fu, execs: execs
    };
  }

  function weekly(D, today) {
    var log = D.log || [], days = [], maxV = 0, tn = 0, tc = 0;
    for (var i = 6; i >= 0; i--) {
      var d = addDays(today, -i), closed = {};
      log.forEach(function (x) { if (x.type === 'Status' && x.to === 'Closed' && dayOf(x.at) === d) closed[x.id] = 1; });
      var n = (D.leads || []).filter(function (l) { return dayOf(l.date) === d; }).length, c = Object.keys(closed).length;
      maxV = Math.max(maxV, n, c); tn += n; tc += c;
      days.push({ day: d, label: fmtDay(d), newLeads: n, closed: c });
    }
    return { from: addDays(today, -6), to: today, days: days, max: maxV, totalNew: tn, totalClosed: tc };
  }

  function monthly(D, ym, adSpend, nowMs) {
    var leads = D.leads || [], map = leadMap(leads), log = D.log || [];
    var inM = function (iso) { return dayOf(iso).slice(0, 7) === ym; };
    var created = leads.filter(function (l) { return inM(l.date); });
    var bySource = { 'Instagram': 0, 'Facebook/Meta': 0, 'Other': 0 }, raw = {};
    created.forEach(function (l) { bySource[bucket(l.source)]++; var k = l.source || '(blank)'; raw[k] = (raw[k] || 0) + 1; });
    var reached = {};
    (D.statuses || []).forEach(function (s) { reached[s] = {}; });
    created.forEach(function (l) { reached.New[l.id] = 1; });
    log.forEach(function (x) {
      if (!inM(x.at)) return;
      if (x.type === 'Created' && reached.New) reached.New[x.id] = 1;
      if (x.type === 'Status' && reached[x.to]) reached[x.to][x.id] = 1;
    });
    var funnel = (D.statuses || []).map(function (s) { return { status: s, count: Object.keys(reached[s]).length }; });
    var reasons = {};
    Object.keys(reached.Lost || {}).forEach(function (id) { var r = (map[id] && map[id].lost) || '(No reason)'; reasons[r] = (reasons[r] || 0) + 1; });
    var closedBy = { 'Instagram': 0, 'Facebook/Meta': 0, 'Other': 0 };
    Object.keys(reached.Closed || {}).forEach(function (id) { if (map[id]) closedBy[bucket(map[id].source)]++; });
    var spend = (adSpend && adSpend[ym]) || {}, totSpend = 0;
    var cost = BUCKETS.map(function (b) {
      var sp = Number(spend[b]) || 0; totSpend += sp;
      return { source: b, spend: sp, leads: bySource[b], closed: closedBy[b],
        cpl: sp && bySource[b] ? Math.round(sp / bySource[b]) : null, cpb: sp && closedBy[b] ? Math.round(sp / closedBy[b]) : null };
    });
    var totClosed = Object.keys(reached.Closed || {}).length;
    var monthStart = Date.parse(ym + '-01T00:00:00+05:30');
    return {
      month: ym, created: created.length, bySource: bySource, rawSources: sortedPairs(raw), funnel: funnel,
      lostReasons: sortedPairs(reasons), cost: cost, totalSpend: totSpend, closed: totClosed,
      cpl: totSpend && created.length ? Math.round(totSpend / created.length) : null,
      cpb: totSpend && totClosed ? Math.round(totSpend / totClosed) : null,
      partial: nowMs ? (nowMs - monthStart > 118 * 86400000) : false
    };
  }

  function scorecard(D, today) {
    var leads = D.leads || [], log = chrono(D.log);
    var reachedBy = {}; // id -> {status:1}
    log.forEach(function (x) { if (x.type === 'Status') { (reachedBy[x.id] = reachedBy[x.id] || {})[x.to] = 1; } });
    var rows = execNames(D).map(function (n) {
      var mine = leads.filter(function (l) { return l.exec === n; });
      var contacted = mine.filter(function (l) {
        if (CONTACTED_PLUS.indexOf(l.status) > -1) return true;
        var r = reachedBy[l.id] || {};
        return CONTACTED_PLUS.some(function (s) { return r[s]; });
      }).length;
      var sv = mine.filter(function (l) { return l.status === 'Site Visit' || l.status === 'Negotiation' || (reachedBy[l.id] || {})['Site Visit']; }).length;
      var closed = mine.filter(function (l) { return l.status === 'Closed'; }).length;
      // response time: Assignment -> pehla baad wala Status change (Assigned/New ke alawa)
      var tot = 0, cnt = 0;
      log.forEach(function (a, i) {
        if (a.type !== 'Assignment' || a.to !== n) return;
        var ta = ms(a.at);
        for (var j = i + 1; j < log.length; j++) {
          var b = log[j];
          if (b.id !== a.id) continue;
          if (b.type === 'Assignment') break;
          if (b.type === 'Status' && b.to !== 'Assigned' && b.to !== 'New') {
            var tb = ms(b.at);
            if (!isNaN(ta) && !isNaN(tb) && tb >= ta) { tot += (tb - ta) / 60000; cnt++; }
            break;
          }
        }
      });
      return {
        name: n, assigned: mine.length, contacted: contacted, contactedPct: pct(contacted, mine.length),
        avgResponse: cnt ? Math.round(tot / cnt) : null, responseSamples: cnt, siteVisits: sv, closed: closed,
        conv: pct(closed, mine.length), overdue: mine.filter(function (l) { return followState(l, today) === 'overdue'; }).length, star: false
      };
    });
    var best = rows.reduce(function (m, r) { return Math.max(m, r.closed); }, 0);
    rows.forEach(function (r) { r.star = best > 0 && r.closed === best; });
    rows.sort(function (a, b) { return b.closed - a.closed || b.conv - a.conv; });
    return rows;
  }

  // ---------- Text digests (WhatsApp to Boss) ----------
  function rupee(n) { return n === null || n === undefined ? '-' : '₹' + Number(n).toLocaleString('en-IN'); }
  function head(company, title) { return (company ? '*' + company + '*\n' : '') + '*' + title + '*'; }
  function dailyText(r, company) {
    var t = [head(company, 'Daily Report - ' + fmtDay(r.date))];
    t.push('New Leads: ' + r.newCount + ' (Instagram ' + r.bySource.Instagram + ', FB/Meta ' + r.bySource['Facebook/Meta'] + ', Other ' + r.bySource.Other + ')');
    if (r.topSource) t.push('Top source: ' + r.topSource.key);
    var sc = Object.keys(r.statusChanges).filter(function (k) { return r.statusChanges[k]; }).map(function (k) { return k + ' ' + r.statusChanges[k]; });
    t.push('Status changes: ' + (sc.length ? sc.join(', ') : 'none'));
    if (r.topLost) t.push('Top lost reason: ' + r.topLost.key + ' (' + r.topLost.count + ')');
    t.push('Follow-ups: Pending ' + r.followups.pending + ' | Today ' + r.followups.today + ' | Tomorrow ' + r.followups.tomorrow + ' | Overdue ' + r.followups.overdue + ' | No date ' + r.followups.none);
    r.execs.forEach(function (e) { t.push('- ' + e.name + ': assigned ' + e.assigned + ', updates ' + e.updates + ', closed ' + e.closed + ', open ' + e.open + ', overdue ' + e.overdue); });
    return t.join('\n');
  }
  function weeklyText(r, company) {
    var t = [head(company, 'Weekly Report ' + fmtDay(r.from) + ' - ' + fmtDay(r.to)), 'New Leads: ' + r.totalNew + ' | Closed: ' + r.totalClosed];
    r.days.forEach(function (d) { t.push(d.label + ': new ' + d.newLeads + ', closed ' + d.closed); });
    return t.join('\n');
  }
  function monthlyText(r, company) {
    var t = [head(company, 'Monthly Report - ' + fmtMonth(r.month))];
    t.push('New Leads: ' + r.created + ' (Instagram ' + r.bySource.Instagram + ', FB/Meta ' + r.bySource['Facebook/Meta'] + ', Other ' + r.bySource.Other + ')');
    t.push('Funnel: ' + r.funnel.map(function (f) { return f.status + ' ' + f.count; }).join(' > '));
    if (r.lostReasons.length) t.push('Lost reasons: ' + r.lostReasons.map(function (x) { return x.key + ' ' + x.count; }).join(', '));
    if (r.totalSpend) t.push('Ad spend ' + rupee(r.totalSpend) + ' | Cost/lead ' + rupee(r.cpl) + ' | Cost/booking ' + rupee(r.cpb));
    return t.join('\n');
  }
  function scoreText(rows, company, today) {
    var t = [head(company, 'Team Scorecard - ' + fmtDay(today))];
    rows.forEach(function (r) {
      t.push((r.star ? '⭐ ' : '- ') + r.name + ': leads ' + r.assigned + ', contacted ' + r.contactedPct + '%, response ' + (r.avgResponse === null ? '-' : r.avgResponse + ' min') +
        ', site visit ' + r.siteVisits + ', closed ' + r.closed + ' (' + r.conv + '%), overdue ' + r.overdue);
    });
    return t.join('\n');
  }

  // ---------- Templates ----------
  function waPhone(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1);
    if (d.length === 10) d = '91' + d;
    return d;
  }
  function tplVars(l, company) {
    l = l || {};
    return { exec: l.exec || '', lead_id: l.id || '', name: l.name || '', phone: l.phone || '', project: l.project || '-',
      source: l.source || '-', followup: l.followup ? fmtDay(l.followup) : '-', company: company || '' };
  }
  function fill(text, vars) {
    return String(text || '').replace(/\{(\w+)\}/g, function (m, k) { return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m; });
  }

  return {
    istDay: istDay, ms: ms, dayOf: dayOf, addDays: addDays, isYmd: isYmd, fmtDay: fmtDay, fmtMonth: fmtMonth, fmtDT: fmtDT, agoText: agoText,
    isOpen: isOpen, bucket: bucket, BUCKETS: BUCKETS, pct: pct, followState: followState, counts: counts,
    dashboard: dashboard, agenda: agenda, filterLeads: filterLeads, toCSV: toCSV, leadsCSV: leadsCSV,
    daily: daily, weekly: weekly, monthly: monthly, scorecard: scorecard, rupee: rupee,
    dailyText: dailyText, weeklyText: weeklyText, monthlyText: monthlyText, scoreText: scoreText,
    waPhone: waPhone, tplVars: tplVars, fill: fill
  };
})();
/*CALC-END*/

// ===== UI (DOM) =====
var S = null, VIEW = 'dash', REP = 'daily', TEAM = 'execs', PENDING = 0, DRAWER = null, DLG = null, CUR_REP = null;
var LF = { q: '', status: '', exec: '', source: '' };
var RS = { date: '', month: '' };
var PH = ['exec', 'lead_id', 'name', 'phone', 'project', 'source', 'followup', 'company'];
var ICON = {
  dash: 'M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z',
  pipe: 'M4 4h4v16H4zm6 0h4v10h-4zm6 0h4v13h-4z',
  agenda: 'M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 10h14v10H5z',
  leads: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z',
  reports: 'M4 20h16v-2H4zm2-4h3V9H6zm5 0h3V4h-3zm5 0h3v-5h-3z',
  team: 'M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-3 0-6 1.5-6 4v2h12v-2c0-2.5-3-4-6-4zm8 0c-.5 0-1 0-1.5.1 1.5 1 2.5 2.3 2.5 3.9v2h7v-2c0-2.5-5-4-8-4z'
};
var NAV = [['dash', 'Dashboard'], ['pipe', 'Pipeline'], ['agenda', 'Agenda'], ['leads', 'Leads'], ['reports', 'Reports'], ['team', 'Master Parameters']];

// ---------- toasts / busy / server calls ----------
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, type === 'err' ? 5500 : 3200);
}
function busy(d) { PENDING = Math.max(0, PENDING + d); $('bar').className = PENDING ? 'on' : ''; }
function errMsg(e) { return String((e && e.message) || e || 'Something went wrong').replace(/^(Exception|Error|ScriptError):\s*/, ''); }
function call(fn, args, ok, fail) {
  busy(1);
  // Apps Script host (google.script.run) — normal mode
  if (window.google && google.script && google.script.run) {
    var r = google.script.run
      .withSuccessHandler(function (res) { busy(-1); if (ok) ok(res); })
      .withFailureHandler(function (e) { busy(-1); toast('⚠️ ' + errMsg(e), 'err'); if (fail) fail(e); });
    r[fn].apply(r, args || []);
    return;
  }
  // Hosted (Firebase) mode — JSONP to BACKEND_URL
  if (!BACKEND_URL) {
    busy(-1);
    toast('⚠️ Backend URL not configured (set BACKEND_URL or ?backend=)', 'err');
    if (fail) fail(new Error('no backend url'));
    return;
  }
  var cbName = 'rpc_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
  var script = document.createElement('script');
  var done = false;
  var timer = setTimeout(function () {
    if (done) return; done = true;
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[cbName];
    busy(-1);
    toast('⚠️ Request timed out', 'err');
    if (fail) fail(new Error('timeout'));
  }, 25000);
  window[cbName] = function (res) {
    if (done) return; done = true;
    clearTimeout(timer);
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[cbName];
    busy(-1);
    if (res && res.ok === false && res.error) { toast('⚠️ ' + errMsg(res.error), 'err'); if (fail) fail(res); }
    else { if (ok) ok(res); }
  };
  script.onerror = function () {
    if (done) return; done = true;
    clearTimeout(timer);
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[cbName];
    busy(-1);
    toast('⚠️ Network error', 'err');
    if (fail) fail(new Error('network'));
  };
  var url = BACKEND_URL + (BACKEND_URL.indexOf('?') > -1 ? '&' : '?') +
    'api=true&fn=' + encodeURIComponent(fn) +
    '&args=' + encodeURIComponent(JSON.stringify(args || [])) +
    '&callback=' + encodeURIComponent(cbName) +
    '&_ts=' + Date.now();
  script.src = url;
  document.body.appendChild(script);
}

  if (ph !== S.settings.bossPhone) call('uiSaveSettings', [{ bossPhone: ph }], function (r) { S.settings = r.settings; toast('Boss number saved ✅', 'ok'); });
  closeDlg();
}
function saveSpend() {
  var ad = JSON.parse(JSON.stringify(S.settings.adSpend || {})), m = {};
  Array.prototype.forEach.call(document.querySelectorAll('[data-spend]'), function (i) { var n = Number(i.value); if (n > 0) m[i.getAttribute('data-spend')] = Math.round(n); });
  ad[RS.month] = m;
  call('uiSaveSettings', [{ adSpend: ad }], function (r) { S.settings = r.settings; toast('Ad spend saved ✅', 'ok'); renderRepBody(); });
}

// ---------- 7. Master Parameters (Sales Executives / Project Sites / Templates) ----------
function renderTeam() {
  $('ttl').textContent = titleFor('team');
  var h = '<div class="seg" id="masterSeg"><button class="' + (TEAM === 'execs' ? 'on' : '') + '" data-act="team" data-k="execs">👥 Sales Executives</button><button class="' + (TEAM === 'sites' ? 'on' : '') + '" data-act="team" data-k="sites">🏢 Project Sites</button><button class="' + (TEAM === 'tpl' ? 'on' : '') + '" data-act="team" data-k="tpl">💬 WhatsApp Templates</button></div>';
  if (TEAM === 'execs') {
    var ym = today().slice(0, 7), closedM = {};
    (S.log || []).forEach(function (x) { if (x.type === 'Status' && x.to === 'Closed' && Calc.dayOf(x.at).slice(0, 7) === ym) closedM[x.id] = 1; });
    h += '<div class="sec-h"><span class="mut">' + S.executives.length + ' sales executives · only Active ones appear in dropdowns</span><button class="btn sm" data-act="exEdit" data-row="">+ Sales Executive</button></div><div class="exg">';
    h += S.executives.length ? S.executives.map(function (e) {
      var mine = S.leads.filter(function (l) { return l.exec === e.name; }), open = mine.filter(Calc.isOpen).length;
      var cm = mine.filter(function (l) { return closedM[l.id]; }).length, on = e.active !== 'No';
      return '<div class="card"><div class="ex"><div class="av">' + initials(e.name) + '</div><div style="flex:1;min-width:0"><b>' + esc(e.name) + '</b>' + (on ? '' : ' <span class="chip">inactive</span>') +
        '<br><span class="mut">📱 ' + esc(e.phone || '-') + '</span></div><button class="sw' + (on ? ' on' : '') + '" title="Active" data-act="exToggle" data-row="' + e.row + '"></button></div>' +
        '<div class="stats4" style="margin:12px 0 8px"><div><b>' + open + '</b><span class="mut">Open leads</span></div><div><b>' + cm + '</b><span class="mut">Closed (this month)</span></div></div>' +
        (e.notes ? '<p class="mut" style="margin:0 0 8px">' + esc(e.notes) + '</p>' : '') +
        '<div class="chips" style="margin:0 0 10px">' + (e.sites && e.sites.length ? e.sites.map(function (s) { return '<span class="chip">🏢 ' + esc(s) + '</span>'; }).join('') : '<span class="mut">No project site assigned</span>') + '</div>' +
        '<div class="row"><button class="btn sm sec" data-act="exEdit" data-row="' + e.row + '">Edit</button><button class="btn sm dng" data-act="exDel" data-row="' + e.row + '">Delete</button></div></div>';
    }).join('') : '<div class="card empty">No sales executives yet. Tap "+ Sales Executive".</div>';
    h += '</div>';
  } else if (TEAM === 'sites') {
    var sites = S.sites || [];
    h += '<div class="sec-h"><span class="mut">' + sites.length + ' project sites · assign them to a sales executive in the Sales Executives tab</span><button class="btn sm" data-act="siteEdit" data-row="">+ Project Site</button></div><div class="exg">';
    h += sites.length ? sites.map(function (s) {
      var who = S.executives.filter(function (e) { return (e.sites || []).some(function (x) { return x.toLowerCase() === s.name.toLowerCase(); }); });
      return '<div class="card"><div class="sec-h" style="margin:0 0 6px"><b>🏢 ' + esc(s.name) + '</b><span class="chip">' + (who.length ? who.length + ' exec' + (who.length > 1 ? 's' : '') : 'Unassigned') + '</span></div>' +
        (s.notes ? '<p class="mut" style="margin:0 0 8px">' + esc(s.notes) + '</p>' : '') +
        '<div class="chips" style="margin:0 0 10px">' + (who.length ? who.map(function (w) { return '<span class="chip">👤 ' + esc(w.name) + (w.active === 'No' ? ' (inactive)' : '') + '</span>'; }).join('') : '<span class="mut">No executive assigned yet</span>') + '</div>' +
        '<div class="row"><button class="btn sm sec" data-act="siteEdit" data-row="' + s.row + '">Edit</button><button class="btn sm dng" data-act="siteDel" data-row="' + s.row + '">Delete</button></div></div>';
    }).join('') : '<div class="card empty">No project sites yet. Tap "+ Project Site".</div>';
    h += '</div>';
  } else {
    h += '<div class="card"><h3>Company Name</h3><div class="row"><input id="tCo" value="' + esc(S.settings.company || '') + '" placeholder="e.g. Vassa Properties"><button class="btn" style="flex:none" data-act="saveCo">Save</button></div><p class="mut" style="margin:6px 0 0">This name replaces {company} in templates.</p></div>' +
      '<div class="sec-h"><span class="mut">The WhatsApp alert link for sales executives is built from the "Lead Assigned" template.</span><button class="btn sm" data-act="tplEdit" data-id="">+ Custom</button></div>';
    h += S.settings.templates.map(function (t) {
      return '<div class="card"><div class="sec-h" style="margin:0 0 6px"><b>' + esc(t.name) + '</b><span>' + (t.isDefault ? '<span class="chip">Default</span> ' : '') + '<span class="chip ' + (t.to === 'exec' ? 's-Contacted' : 's-Closed') + '">' + (t.to === 'exec' ? 'To Sales Executive' : 'To Customer') + '</span></span></div>' +
        '<div class="mut" style="white-space:pre-wrap;max-height:62px;overflow:hidden">' + esc(t.text) + '</div><button class="btn sm sec" style="margin-top:8px" data-act="tplEdit" data-id="' + esc(t.id) + '">Edit / Preview</button></div>';
    }).join('');
  }
  $('v-team').innerHTML = h;
}
function exDlg(row) {
  var e = row ? S.executives.filter(function (x) { return String(x.row) === String(row); })[0] : { row: '', name: '', phone: '', active: 'Yes', notes: '', sites: [] };
  if (!e) return;
  var picked = (e.sites || []).map(function (s) { return s.toLowerCase(); });
  var all = (S.sites || []).slice();
  // jo site master me nahi hai par executive ke paas hai, wo bhi dikhao (purana data)
  (e.sites || []).forEach(function (s) { if (!all.some(function (x) { return x.name.toLowerCase() === s.toLowerCase(); })) all.push({ name: s, row: '' }); });
  var picker = all.length
    ? '<div class="dd" id="eSitesDD"><button type="button" class="ddbtn" data-dd="1"><span id="eSitesTxt">' + sitesSummary(picked.length) + '</span><i class="caret">▾</i></button>' +
      '<div class="ddmenu">' + all.map(function (s) {
        var on = picked.indexOf(s.name.toLowerCase()) > -1;
        return '<label><input type="checkbox" data-ddchg="1" value="' + esc(s.name) + '"' + (on ? ' checked' : '') + '><span>' + esc(s.name) + '</span></label>';
      }).join('') + '</div></div>'
    : '<p class="mut">No project sites yet. Add them in the Project Sites tab first.</p>';
  openDlg('<h3>' + (row ? 'Edit Sales Executive' : 'New Sales Executive') + '</h3><label class="f">Name</label><input id="eName" value="' + esc(e.name) + '">' +
    '<label class="f">WhatsApp number</label><input id="ePhone" type="tel" inputmode="numeric" placeholder="10 digits, e.g. 9876543210" value="' + esc(String(e.phone).replace(/^91(?=\d{10}$)/, '')) + '">' +
    '<label class="f">Project Sites</label>' + picker +
    '<div class="row"><div><label class="f">Active</label><select id="eActive"><option' + (e.active !== 'No' ? ' selected' : '') + '>Yes</option><option' + (e.active === 'No' ? ' selected' : '') + '>No</option></select></div>' +
    '<div><label class="f">Notes</label><input id="eNotes" value="' + esc(e.notes) + '"></div></div>' + (row ? '<p class="mut">Changing the name will also update it in the Leads sheet.</p>' : '') + dlgBtns('Save'), function () {
      var box = $('eSitesDD'), sites = [];
      if (box) Array.prototype.forEach.call(box.querySelectorAll('input[type=checkbox]:checked'), function (c) { sites.push(c.value); });
      var ex = { row: e.row, name: $('eName').value.trim(), phone: $('ePhone').value.trim(), active: $('eActive').value, notes: $('eNotes').value.trim(), sites: sites };
      if (!ex.name) { toast('Please enter a name', 'warn'); return false; }
      call('uiSaveExecutive', [ex], function (list) { S.executives = list; toast('Sales executive saved ✅', 'ok'); render(); sync(); });
    });
}
function sitesSummary(n) { return n ? n + ' site' + (n > 1 ? 's' : '') + ' selected' : 'Select project sites'; }
function ddSummary() {
  var box = $('eSitesDD'), txt = $('eSitesTxt');
  if (!box || !txt) return;
  txt.textContent = sitesSummary(box.querySelectorAll('input[type=checkbox]:checked').length);
}
function exToggle(row) {
  var e = S.executives.filter(function (x) { return String(x.row) === String(row); })[0];
  if (!e) return;
  var nx = { row: e.row, name: e.name, phone: e.phone, active: e.active === 'No' ? 'Yes' : 'No', notes: e.notes, sites: e.sites || [] };
  e.active = nx.active; render();
  call('uiSaveExecutive', [nx], function (list) { S.executives = list; toast(e.name + ': ' + (nx.active === 'Yes' ? 'Active' : 'Inactive'), 'ok'); render(); }, function () { e.active = nx.active === 'Yes' ? 'No' : 'Yes'; render(); });
}
function exDel(row) {
  var e = S.executives.filter(function (x) { return String(x.row) === String(row); })[0];
  if (!e) return;
  var open = S.leads.filter(function (l) { return l.exec === e.name && Calc.isOpen(l); }).length;
  if (open) { toast(e.name + ' has ' + open + ' open lead(s). Reassign them first or mark as Inactive.', 'warn'); return; }
  confirmDlg('Remove ' + e.name + '? The name will remain on past leads and in the log.', 'Yes, Delete', function () {
    call('uiDeleteExecutive', [e.row], function (list) { S.executives = list; toast('Sales executive removed', 'ok'); render(); });
  });
}
function siteDlg(row) {
  var s = row ? (S.sites || []).filter(function (x) { return String(x.row) === String(row); })[0] : { row: '', name: '', notes: '' };
  if (!s) return;
  openDlg('<h3>' + (row ? 'Edit Project Site' : 'New Project Site') + '</h3><label class="f">Project Site / Building</label><input id="pName" value="' + esc(s.name) + '" placeholder="e.g. Vassa Heights, Vassa Greens">' +
    '<label class="f">Notes (optional)</label><input id="pNotes" value="' + esc(s.notes) + '" placeholder="Location, tower, plot numbers…">' +
    (row ? '<p class="mut">Renaming will also update it on every sales executive.</p>' : '<p class="mut">Save it here, then assign it to a sales executive in the Sales Executives tab.</p>') + dlgBtns('Save'), function () {
      var d = { row: s.row, name: $('pName').value.trim(), notes: $('pNotes').value.trim() };
      if (!d.name) { toast('Please enter a project site name', 'warn'); return false; }
      call('uiSaveSite', [d], function (r) { S.sites = r.sites; S.executives = r.executives; toast('Project site saved ✅', 'ok'); render(); sync(); });
    });
}
function siteDel(row) {
  var s = (S.sites || []).filter(function (x) { return String(x.row) === String(row); })[0];
  if (!s) return;
  var who = S.executives.filter(function (e) { return (e.sites || []).some(function (x) { return x.toLowerCase() === s.name.toLowerCase(); }); });
  if (who.length) { toast(s.name + ' is assigned to ' + who.map(function (w) { return w.name; }).join(', ') + '. Remove it from them first.', 'warn'); return; }
  confirmDlg('Remove ' + s.name + ' from Project Sites?', 'Yes, Delete', function () {
    call('uiDeleteSite', [s.row], function (r) { S.sites = r.sites; S.executives = r.executives; toast('Project site removed', 'ok'); render(); });
  });
}
function saveTemplates(list, okMsg, after) {
  call('uiSaveSettings', [{ templates: list }], function (r) { S.settings = r.settings; S.defaults = r.defaults; toast(okMsg || 'Template saved ✅', 'ok'); render(); if (after) after(); });
}
function tplDlg(id) {
  var t = id ? tpl(id) : { id: '', name: '', to: 'customer', text: '', isDefault: false };
  if (!t) return;
  var leads = S.leads.slice(0, 60);
  openDlg('<h3>' + (id ? 'Edit Template' : 'New Custom Template') + '</h3><label class="f">Name</label><input id="tName" value="' + esc(t.name) + '"' + (t.isDefault ? ' disabled' : '') + '>' +
    (t.isDefault ? '' : '<label class="f">Send to</label><select id="tTo"><option value="customer"' + (t.to !== 'exec' ? ' selected' : '') + '>To Customer</option><option value="exec"' + (t.to === 'exec' ? ' selected' : '') + '>To Sales Executive</option></select>') +
    '<label class="f">Message</label><div class="chips">' + PH.map(function (p) { return '<button data-act="ins" data-ph="{' + p + '}">{' + p + '}</button>'; }).join('') + '</div>' +
    '<textarea id="tText" rows="7" data-inp="tplPrev">' + esc(t.text) + '</textarea><label class="f">Preview with this lead</label><select id="tLead" data-chg="tplPrev">' +
    (leads.length ? leads.map(function (l) { return '<option value="' + esc(l.id) + '">' + esc(l.id + ' · ' + (l.name || '')) + '</option>'; }).join('') : '<option value="">(sample)</option>') + '</select>' +
    '<div class="pv" id="tPrev" style="margin-top:8px"></div><div class="row" style="margin-top:14px">' +
    (t.isDefault ? '<button class="btn gry" data-act="tplReset" data-id="' + esc(t.id) + '">Reset default</button>' : (id ? '<button class="btn dng" data-act="tplDel" data-id="' + esc(t.id) + '">Delete</button>' : '')) +
    '<button class="btn gry" data-act="closeDlg">Cancel</button><button class="btn" data-act="dlgOk">Save</button></div>', function () {
      var text = $('tText').value, name = $('tName').value.trim();
      if (!text.trim()) { toast('Message cannot be empty', 'warn'); return false; }
      if (!name) { toast('Please enter a template name', 'warn'); return false; }
      var list = S.settings.templates.map(function (x) { return { id: x.id, name: x.name, to: x.to, text: x.text }; });
      if (id) list.forEach(function (x) { if (x.id === id) { x.text = text; if (!t.isDefault) { x.name = name; x.to = $('tTo').value; } } });
      else list.push({ id: 'c' + Date.now().toString(36), name: name, to: $('tTo').value, text: text });
      saveTemplates(list);
    });
  tplPreview();
}
function tplPreview() {
  if (!$('tPrev')) return;
  var l = lead($('tLead').value) || { id: 'L-0001', name: 'Ramesh Patil', phone: '919800000000', project: 'Green Valley', source: 'Instagram', exec: 'Amit', followup: today() };
  $('tPrev').textContent = Calc.fill($('tText').value, Calc.tplVars(l, S.settings.company));
}
function insertPh(ph) {
  var ta = $('tText'), s = ta.selectionStart || ta.value.length, e = ta.selectionEnd || s;
  ta.value = ta.value.slice(0, s) + ph + ta.value.slice(e);
  ta.focus(); try { ta.setSelectionRange(s + ph.length, s + ph.length); } catch (x) {}
  tplPreview();
}

// ---------- events (delegation: koi inline JS nahi, XSS-safe) ----------
var ACT = {
  refresh: function () { $('boot').style.display = S ? 'none' : 'block'; load(); },
  go: function (el) { closeDrawer(); go(el.getAttribute('data-v')); },
  open: function (el) { openLead(el.getAttribute('data-id')); },
  closeDrawer: closeDrawer,
  closeDlg: function () { closeDlg(true); },
  dlgOk: dlgOk,
  lf: function (el) { LF = { q: '', status: el.getAttribute('data-status') || '', exec: '', source: '' }; if ($('lQ')) $('lQ').value = ''; go('leads'); },
  lfUn: function () { LF = { q: '', status: 'New', exec: '__none', source: '' }; if ($('lQ')) $('lQ').value = ''; go('leads'); },
  addLead: addLeadDlg,
  leadsCsv: leadsCsv,
  dSave: function (el) { dSave(el.getAttribute('data-id')); },
  qd: function (el) { $('qDate').value = el.getAttribute('data-d'); },
  csvCopy: function () { copyText($('csvTxt')); },
  csvDl: function (el) { csvDownload(el.getAttribute('data-name')); },
  rep: function (el) { REP = el.getAttribute('data-k'); renderReports(); },
  rPrint: function () { window.print(); },
  rCsv: function () { if (CUR_REP) showCsv(CUR_REP.name, CUR_REP.csv); },
  rBoss: bossDlg,
  bossSend: bossSend,
  saveSpend: saveSpend,
  team: function (el) { TEAM = el.getAttribute('data-k'); renderTeam(); renderNav(); },
  masterToggle: function () {
    if (TEAM_OPEN) { TEAM_OPEN = false; renderNav(); }
    else if (VIEW === 'team') { TEAM_OPEN = true; renderNav(); }
    else { TEAM_OPEN = true; go('team'); }
  },
  masterTab: function (el) { TEAM = el.getAttribute('data-k'); TEAM_OPEN = true; go('team'); },
  siteEdit: function (el) { siteDlg(el.getAttribute('data-row')); },
  siteDel: function (el) { siteDel(el.getAttribute('data-row')); },
  exEdit: function (el) { exDlg(el.getAttribute('data-row')); },
  exToggle: function (el) { exToggle(el.getAttribute('data-row')); },
  exDel: function (el) { exDel(el.getAttribute('data-row')); },
  saveCo: function () { call('uiSaveSettings', [{ company: $('tCo').value.trim() }], function (r) { S.settings = r.settings; $('sub').textContent = S.settings.company || ''; toast('Company saved ✅', 'ok'); }); },
  tplEdit: function (el) { tplDlg(el.getAttribute('data-id')); },
  ins: function (el) { insertPh(el.getAttribute('data-ph')); },
  tplReset: function (el) {
    var d = (S.defaults || []).filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
    if (d) { $('tText').value = d.text; tplPreview(); toast('Default text restored — tap Save'); }
  },
  tplDel: function (el) {
    var id = el.getAttribute('data-id');
    closeDlg();
    confirmDlg('Delete this custom template?', 'Delete', function () {
      saveTemplates(S.settings.templates.filter(function (x) { return x.id !== id; }).map(function (x) { return { id: x.id, name: x.name, to: x.to, text: x.text }; }), 'Template deleted');
    });
  }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  if (e.target.closest('select,input,textarea,a') && el.getAttribute('data-act') === 'open') return; // card ke andar dropdown/link
  var f = ACT[el.getAttribute('data-act')];
  if (f) { e.preventDefault(); f(el, e); }
});
// Project Sites dropdown (executive dialog) - button par tap = open/close
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-dd]') : null;
  if (!b) return;
  e.preventDefault();
  var w = b.parentNode;
  w.className = w.className.indexOf('on') > -1 ? 'dd' : 'dd on';
});
document.addEventListener('change', function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute('data-chg');
  if (el.getAttribute && el.getAttribute('data-ddchg')) { ddSummary(); return; }
  if (!k) return;
  if (k === 'move') changeStatus(el.getAttribute('data-id'), el.value);
  else if (k === 'lf') { LF.status = $('lS').value; LF.exec = $('lE').value; LF.source = $('lSrc').value; renderLeadList(); }
  else if (k === 'dStatus') dStatusUi();
  else if (k === 'rDate') { if (Calc.isYmd(el.value)) { RS.date = el.value; renderRepBody(); } }
  else if (k === 'rMonth') { if (/^\d{4}-\d{2}$/.test(el.value)) { RS.month = el.value; renderRepBody(); } }
  else if (k === 'tplPrev') tplPreview();
});
var qT = null;
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-inp');
  if (k === 'lq') { clearTimeout(qT); qT = setTimeout(function () { LF.q = $('lQ').value; renderLeadList(); }, 150); }
  else if (k === 'tplPrev') tplPreview();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (DLG) closeDlg(true); else if (DRAWER) closeDrawer(); } });

renderNav();
load();
</script>
